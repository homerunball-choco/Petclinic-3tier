
<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/petclinic
    DirectoryIndex index.html

    <Directory /var/www/petclinic>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    # WEB API 요청 -> WAS
    ProxyPass /api/ http://127.0.0.1:8080/petclinic/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/petclinic/api/

    # 기존 Petclinic 애플리케이션
    ProxyPass /petclinic/ http://127.0.0.1:8080/petclinic/
    ProxyPassReverse /petclinic/ http://127.0.0.1:8080/petclinic/

    ErrorLog ${APACHE_LOG_DIR}/petclinic-error.log
    CustomLog ${APACHE_LOG_DIR}/petclinic-access.log combined
</VirtualHost>
